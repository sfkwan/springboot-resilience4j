global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "spring-boot-app"
    metrics_path: "/actuator/prometheus" # Tells Prometheus where to find the metrics
    static_configs:
      - targets: ["192.168.64.1:8080"] # Route
